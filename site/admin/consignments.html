<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>KHARAWA — Consignment Admin</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="./consignments.css" />
</head>
<body class="admin-body">
  <header class="admin-header">
    <a class="admin-brand" href="../index.html">KHARAWA <span>/ CONSIGNMENT</span></a>
    <div class="admin-header-actions"><button class="admin-lang is-active" data-admin-lang="th">TH</button><span>/</span><button class="admin-lang" data-admin-lang="en">EN</button><a href="../index.html" class="admin-back" data-admin-i18n="back">กลับหน้าเว็บไซต์ ↗</a></div>
  </header>
  <main class="admin-main">
    <section class="admin-intro"><div><p class="eyebrow dark" data-admin-i18n="eyebrow">PRIVATE WORKSPACE</p><h1 data-admin-i18n="title">รายการ<br /><em>ฝากขาย</em></h1><p data-admin-i18n="subtitle">ตรวจสอบรายการที่ลูกค้าส่งมา เปลี่ยนสถานะ และเปิดดูรายละเอียดได้จากที่เดียว</p></div><span class="storage-note" data-admin-i18n="storage">โหมดร่างข้อมูลใน Browser</span></section>
    <section class="admin-stats" aria-label="สรุปสถานะ"><article><strong id="stat-all">0</strong><span data-admin-i18n="all">ทั้งหมด</span></article><article><strong id="stat-pending">0</strong><span data-admin-i18n="pending">รอตรวจสอบ</span></article><article><strong id="stat-reviewing">0</strong><span data-admin-i18n="reviewing">กำลังตรวจ</span></article><article><strong id="stat-approved">0</strong><span data-admin-i18n="approved">อนุมัติแล้ว</span></article></section>
    <section class="admin-toolbar"><label class="search-box"><span data-admin-i18n="search">ค้นหา</span><input id="search-input" type="search" placeholder="ชื่อสินค้า / ช่องทางติดต่อ" /></label><label><span data-admin-i18n="filter">กรองสถานะ</span><select id="status-filter"><option value="all" data-admin-i18n="all">ทั้งหมด</option><option value="pending" data-admin-i18n="pending">รอตรวจสอบ</option><option value="reviewing" data-admin-i18n="reviewing">กำลังตรวจ</option><option value="approved" data-admin-i18n="approved">อนุมัติแล้ว</option><option value="listed" data-admin-i18n="listed">ลงขายแล้ว</option><option value="sold" data-admin-i18n="sold">ขายแล้ว</option><option value="rejected" data-admin-i18n="rejected">ไม่รับฝาก</option></select></label><button id="refresh-button" class="admin-button" data-admin-i18n="refresh">รีเฟรช</button></section>
    <section class="admin-content"><div id="submission-list" class="submission-list"></div><aside id="submission-detail" class="submission-detail" aria-live="polite"><p class="detail-empty" data-admin-i18n="select">เลือกรายการเพื่อดูรายละเอียด</p></aside></section>
  </main>
  <script src="./consignments.js"></script>
</body>
</html>
